<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameAcc - Shop Tài Khoản Tự Động</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-section { display: none; }
        .page-section.active { display: block; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Left: Nút 3 gạch & Logo -->
                <div class="flex items-center gap-3">
                    <!-- Nút 3 gạch mở menu mobile -->
                    <button id="mobile-menu-btn" class="md:hidden text-gray-600 hover:text-indigo-600 focus:outline-none p-1">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                    <!-- Logo -->
                    <div class="flex items-center cursor-pointer" onclick="switchTab('home')">
                        <i class="fa-solid fa-gamepad text-2xl text-indigo-600 mr-2"></i>
                        <span class="font-bold text-xl text-gray-900">Game<span class="text-indigo-600">Acc</span></span>
                    </div>
                </div>
                
                <!-- Menu Navigation (Desktop) -->
                <nav class="hidden md:flex space-x-6 items-center">
                    <button onclick="switchTab('home')" class="text-gray-600 hover:text-indigo-600 font-medium transition">Trang Chủ</button>
                    <button onclick="switchTab('history')" class="text-gray-600 hover:text-indigo-600 font-medium transition">Lịch Sử Mua</button>
                    <button onclick="switchTab('support')" class="text-gray-600 hover:text-indigo-600 font-medium transition">Hỗ Trợ</button>
                    <!-- NÚT ADMIN (Mặc định ẩn) -->
                    <button id="nav-admin" onclick="switchTab('admin')" class="hidden bg-red-100 text-red-600 px-3 py-1 rounded font-bold hover:bg-red-200 transition">
                        <i class="fa-solid fa-screwdriver-wrench mr-1"></i> Admin Panel
                    </button>
                </nav>

                <!-- User Area -->
                <div id="user-area" class="flex items-center gap-3">
                    <button onclick="switchTab('auth')" class="bg-indigo-50 text-indigo-700 px-4 py-2 rounded-lg font-bold hover:bg-indigo-100 transition text-sm">Đăng Nhập</button>
                </div>
            </div>
        </div>
    </header>

    <!-- MOBILE SIDEBAR MENU -->
    <div id="mobile-sidebar" class="fixed inset-0 z-50 bg-black bg-opacity-50 hidden transition-opacity">
        <div class="absolute left-0 top-0 bottom-0 w-64 bg-white shadow-xl p-5 flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center mb-6 border-b pb-4">
                    <div class="flex items-center">
                        <i class="fa-solid fa-gamepad text-xl text-indigo-600 mr-2"></i>
                        <span class="font-bold text-lg text-gray-900">Game<span class="text-indigo-600">Acc</span></span>
                    </div>
                    <button id="close-sidebar-btn" class="text-gray-500 hover:text-gray-700">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
                <nav class="space-y-3 flex flex-col">
                    <button onclick="switchTab('home'); toggleMobileMenu()" class="text-left py-2 px-3 rounded-lg text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 font-medium"><i class="fa-solid fa-house mr-3 w-5"></i> Trang Chủ</button>
                    <button onclick="switchTab('history'); toggleMobileMenu()" class="text-left py-2 px-3 rounded-lg text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 font-medium"><i class="fa-solid fa-clock-rotate-left mr-3 w-5"></i> Lịch Sử Mua</button>
                    <button onclick="switchTab('support'); toggleMobileMenu()" class="text-left py-2 px-3 rounded-lg text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 font-medium"><i class="fa-solid fa-headset mr-3 w-5"></i> Hỗ Trợ</button>
                    <!-- NÚT ADMIN MOBILE (Mặc định ẩn) -->
                    <button id="nav-admin-mobile" onclick="switchTab('admin'); toggleMobileMenu()" class="hidden text-left py-2 px-3 rounded-lg text-red-600 bg-red-50 hover:bg-red-100 font-bold">
                        <i class="fa-solid fa-screwdriver-wrench mr-3 w-5"></i> Admin Panel
                    </button>
                </nav>
            </div>
            <div class="text-xs text-center text-gray-400 border-t pt-4">
                ShopAccLienQuan © 2026
            </div>
        </div>
    </div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">

        <!-- 1. TRANG CHỦ -->
        <section id="section-home" class="page-section active">
            <h3 class="text-xl font-bold text-gray-900 mb-4 border-l-4 border-indigo-600 pl-3">Tài khoản Đang Bán</h3>
            <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <p class="text-gray-500">Đang tải dữ liệu...</p>
            </div>
        </section>

        <!-- 2. ĐĂNG NHẬP / ĐĂNG KÝ -->
        <section id="section-auth" class="page-section">
            <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                <div class="text-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-900" id="auth-title">Đăng Nhập</h2>
                </div>
                <form id="auth-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Email</label>
                        <input type="email" id="auth-email" required class="w-full px-4 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Mật khẩu</label>
                        <input type="password" id="auth-password" required minlength="6" class="w-full px-4 py-2 border rounded-lg">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-lg" id="auth-submit-btn">Đăng Nhập</button>
                </form>
                <div class="mt-4 text-center text-sm text-gray-600">
                    <span id="auth-toggle-text">Chưa có tài khoản?</span> 
                    <button id="auth-toggle-btn" class="text-indigo-600 font-bold">Đăng ký ngay</button>
                </div>
            </div>
        </section>

        <!-- 3. LỊCH SỬ MUA HÀNG -->
        <section id="section-history" class="page-section">
            <h3 class="text-xl font-bold mb-6 border-l-4 border-indigo-600 pl-3">Lịch Sử Mua Hàng</h3>
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-gray-50 text-sm border-b">
                            <th class="p-4">Tên tài khoản</th>
                            <th class="p-4">Giá</th>
                            <th class="p-4">Thông tin (TK|MK)</th>
                            <th class="p-4">Trạng thái</th>
                        </tr>
                    </thead>
                    <tbody id="history-list" class="text-sm divide-y"></tbody>
                </table>
            </div>
        </section>

        <!-- 4. HỖ TRỢ -->
        <section id="section-support" class="page-section">
            <h3 class="text-xl font-bold mb-6 border-l-4 border-indigo-600 pl-3">Hỗ Trợ</h3>
            <p>Liên hệ Admin qua Zalo: 0334671178</p>
        </section>

        <!-- 5. TRANG ADMIN (Chỉ Admin mới thấy) -->
        <section id="section-admin" class="page-section">
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200 max-w-2xl mx-auto">
                <h3 class="text-2xl font-bold text-red-600 mb-6 border-b pb-4"><i class="fa-solid fa-lock mr-2"></i>Khu Vực Đăng Bán Acc</h3>
                
                <form id="admin-add-acc-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Tiêu đề (VD: Acc LV12 Trắng TT)</label>
                        <input type="text" id="add-title" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Giá bán (VNĐ)</label>
                        <input type="number" id="add-price" required min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Thông tin Acc (Định dạng TK|MK|MAIL|PASS)</label>
                        <input type="text" id="add-info" required class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 text-green-700 font-mono">
                    </div>
                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg shadow-md transition mt-4">
                        <i class="fa-solid fa-cloud-arrow-up mr-2"></i>Đăng Bán Lên Shop
                    </button>
                </form>
            </div>
        </section>

    </main>

    <!-- JAVASCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, doc, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js";

        // === 1. ĐIỀN EMAIL ADMIN CỦA BẠN VÀO ĐÂY ===
        const ADMIN_EMAIL = "tthung3012@gmail.com"; 

        // === 2. ĐIỀN CẤU HÌNH FIREBASE ===
        const firebaseConfig = {
            apiKey: "AIzaSyBuovkNlYRF_ECaqQEujJ9Lc6gn4ZjCmSA",
            authDomain: "shopacclienquan-f2506.firebaseapp.com",
            projectId: "shopacclienquan-f2506",
            storageBucket: "shopacclienquan-f2506.firebasestorage.app",
            messagingSenderId: "970631977402",
            appId: "1:970631977402:web:f8c685f7fc54125277e583"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const functions = getFunctions(app);
        let currentUser = null;

        // Xử lý bật/tắt Sidebar trên mobile
        const mobileSidebar = document.getElementById('mobile-sidebar');
        window.toggleMobileMenu = function() {
            mobileSidebar.classList.toggle('hidden');
        }
        document.getElementById('mobile-menu-btn').addEventListener('click', toggleMobileMenu);
        document.getElementById('close-sidebar-btn').addEventListener('click', toggleMobileMenu);
        mobileSidebar.addEventListener('click', (e) => {
            if (e.target === mobileSidebar) toggleMobileMenu();
        });

        // Chuyển Tab
        window.switchTab = function(tabId) {
            if(tabId === 'history' && !currentUser) return alert("Vui lòng đăng nhập!"), switchTab('auth');
            if(tabId === 'admin' && (!currentUser || currentUser.email !== ADMIN_EMAIL)) return alert("Bạn không có quyền truy cập!");
            
            document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById('section-' + tabId).classList.add('active');
        };

        // Form Đăng nhập
        let isLoginMode = true;
        document.getElementById('auth-toggle-btn').addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? "Đăng Nhập" : "Tạo Tài Khoản";
            document.getElementById('auth-submit-btn').innerText = isLoginMode ? "Đăng Nhập" : "Đăng Ký";
            document.getElementById('auth-toggle-text').innerText = isLoginMode ? "Chưa có tài khoản?" : "Đã có tài khoản?";
            document.getElementById('auth-toggle-btn').innerText = isLoginMode ? "Đăng ký ngay" : "Đăng nhập";
        });

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            try {
                if (isLoginMode) await signInWithEmailAndPassword(auth, email, password);
                else await createUserWithEmailAndPassword(auth, email, password);
                alert("Thành công!");
                switchTab('home');
                e.target.reset();
            } catch (error) {
                alert("Lỗi: " + error.message);
            }
        });

        // Theo dõi User & Hiển thị nút Admin (cả Desktop và Mobile)
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const userArea = document.getElementById('user-area');
            const navAdmin = document.getElementById('nav-admin');
            const navAdminMobile = document.getElementById('nav-admin-mobile');
            
            if (user) {
                if (user.email === ADMIN_EMAIL) {
                    navAdmin.classList.remove('hidden');
                    navAdminMobile.classList.remove('hidden');
                } else {
                    navAdmin.classList.add('hidden');
                    navAdminMobile.classList.add('hidden');
                }

                onSnapshot(doc(db, 'users', user.uid), (docSnap) => {
                    let balance = docSnap.exists() ? docSnap.data().balance : 0;
                    userArea.innerHTML = `
                        <div class="bg-indigo-50 border border-indigo-200 text-indigo-700 px-3 py-1.5 rounded-lg font-bold text-sm">
                            <i class="fa-solid fa-wallet mr-2"></i> ${balance.toLocaleString()}đ
                        </div>
                        <button id="logout-btn" class="text-gray-500 hover:text-red-500 px-2"><i class="fa-solid fa-right-from-bracket"></i></button>
                    `;
                    document.getElementById('logout-btn').addEventListener('click', () => { signOut(auth); switchTab('home'); });
                });
                loadHistory();
            } else {
                navAdmin.classList.add('hidden');
                navAdminMobile.classList.add('hidden');
                userArea.innerHTML = `<button onclick="switchTab('auth')" class="bg-indigo-50 text-indigo-700 px-4 py-2 rounded-lg font-bold">Đăng Nhập</button>`;
            }
        });

        // Tải Danh sách Acc trang chủ
        onSnapshot(query(collection(db, "accounts"), where("status", "==", "available")), (snapshot) => {
            const productList = document.getElementById('product-list');
            productList.innerHTML = '';
            if (snapshot.empty) return productList.innerHTML = '<p class="text-red-500">Chưa có tài khoản nào được bán.</p>';
            
            snapshot.forEach((docSnap) => {
                const acc = docSnap.data();
                productList.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm border p-4">
                        <h4 class="font-bold text-gray-800 mb-2 truncate">${acc.title}</h4>
                        <p class="text-indigo-600 font-extrabold text-lg mb-3">${Number(acc.price).toLocaleString()}đ</p>
                        <button onclick="buyAccount('${docSnap.id}')" class="w-full bg-indigo-600 text-white font-bold py-2 rounded-lg">Mua Ngay</button>
                    </div>
                `;
            });
        });

        // --- CHỨC NĂNG CỦA ADMIN: ĐĂNG BÁN ACC ---
        document.getElementById('admin-add-acc-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser || currentUser.email !== ADMIN_EMAIL) return alert("Chỉ Admin mới được thêm acc!");

            const title = document.getElementById('add-title').value;
            const price = Number(document.getElementById('add-price').value);
            const info = document.getElementById('add-info').value;

            try {
                await addDoc(collection(db, "accounts"), {
                    title: title,
                    price: price,
                    account_info: info,
                    status: "available",
                    buyer_uid: null,
                    created_at: serverTimestamp()
                });
                alert("Đăng bán thành công!");
                e.target.reset();
                switchTab('home');
            } catch (error) {
                alert("Lỗi khi đăng acc: " + error.message);
            }
        });

        // Lịch sử mua hàng
        function loadHistory() {
            if(!currentUser) return;
            const historyList = document.getElementById('history-list');
            onSnapshot(query(collection(db, "accounts"), where("buyer_uid", "==", currentUser.uid)), (snapshot) => {
                historyList.innerHTML = '';
                if(snapshot.empty) return historyList.innerHTML = `<tr><td colspan="4" class="p-4 text-center">Trống</td></tr>`;
                snapshot.forEach(docSnap => {
                    const acc = docSnap.data();
                    historyList.innerHTML += `
                        <tr class="border-b">
                            <td class="p-4">${acc.title}</td>
                            <td class="p-4 text-red-600 font-bold">${Number(acc.price).toLocaleString()}đ</td>
                            <td class="p-4"><code>${acc.account_info}</code></td>
                            <td class="p-4 text-green-600 font-bold">Thành công</td>
                        </tr>
                    `;
                });
            });
        }
    </script>
</body>
</html>
